name: Testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.os }}
          path: web/dist
